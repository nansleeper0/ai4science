ontology: переменность-рентгеновских-пульсаров
goal: 'Сопоставлять модели связи периодической и апериодической переменности для аналитического обзора:
  отделять механизм, предпосылки, проверяемые утверждения, ограничения и подтверждения по источникам.'
competency_questions:
- Какие механизмы описывают сравниваемые модели и как различаются их предсказания?
- На каких публикациях и предпосылках основана каждая модель?
- Где в первоисточнике сформулировано каждое утверждение и какие условия к нему относятся?
- Какие утверждения уже сверены, каким способом и какие ограничения мешают переносу выводов на EXO2030+375?
- В каких файлах сохранено сравнение, какие задачи выполнены и что ещё требует проверки или решения?
classes:
  Источник:
    parent: null
    definition: конкретная научная публикация с авторами, идентификатором и версией; не список литературы
      целиком
  Автор:
    parent: null
    definition: человек — автор опубликованной работы
  ЗапросКГрафу:
    parent: null
    definition: обращение к внешнему графу знаний — источник, инструмент и аргументы, дата, число найденных записей
  Модель:
    parent: null
    definition: описанный в публикации механизм или математическая схема связи переменности и пульсаций
  Утверждение:
    parent: null
    definition: проверяемое допущение, предсказание или результат конкретной модели, привязанный к странице
      источника
  Проверка:
    parent: null
    definition: действие по сверке цитаты, структуры или результата с указанным способом; не автоматическая
      человеческая приёмка
  Ограничение:
    parent: null
    definition: условие применимости или явно отмеченная граница вывода конкретной модели
  Анализ:
    parent: null
    definition: сопоставление моделей по заранее заданным полям с сохранённой таблицей
  Подготовка:
    parent: null
    definition: техническая подготовка файлов, заметок классов или визуализации, закрывающая соответствующую
      подзадачу
  Отчёт:
    parent: null
    definition: связный текст обзора или сравнения в reports/ со ссылками на источники и объекты графа
  Задача:
    parent: null
    definition: поручение пользователя или подзадача с проверяемым условием готовности и статусом
  Файл:
    parent: null
    definition: реально существующий файл внутри проекта; сам файл является узлом, отдельная заметка о
      нём не нужна
properties:
  основанаНа:
    domain:
    - Модель
    - Проверка
    range: Источник
  сформулированоВ:
    domain: Утверждение
    range: Источник
  относитсяК:
    domain: Утверждение
    range: Модель
  проверенЧерез:
    domain: Утверждение
    range: Проверка
  ограничивает:
    domain: Ограничение
    range: Модель
  использует:
    domain: Анализ
    range: Источник
  сопоставляет:
    domain: Анализ
    range: Модель
  решает:
    domain:
    - Анализ
    - Проверка
    - Подготовка
    - ЗапросКГрафу
    range: Задача
  выполняет:
    domain: Отчёт
    range: Задача
  описывает:
    domain: Отчёт
    range:
    - Модель
    - Утверждение
    - Проверка
    - Ограничение
    - Анализ
  ссылаетсяНа:
    domain: Отчёт
    range: Источник
  хранитсяВ:
    domain:
    - Источник
    - Модель
    - Проверка
    - Анализ
    range: Файл
  найденЗапросом:
    domain: Источник
    range: ЗапросКГрафу
  написан:
    domain: Источник
    range: Автор
  цитирует:
    domain: Источник
    range: Источник
  реализованВ:
    domain:
    - Проверка
    - Анализ
    - Подготовка
    range: Файл
  подзадачаОт:
    domain: Задача
    range: Задача
    characteristics:
    - транзитивное
attributes:
  status:
    domain: Задача
    values:
    - открыта
    - в работе
    - выполнена
    - заблокирована
    - принята
  роль:
    domain: Утверждение
    values:
    - предпосылка
    - предсказание
    - результат
  способ:
    domain: Проверка
    values:
    - совпадение цитаты
    - структура графа
    - человеческая сверка
rules:
- id: П1
  text: Каждый источник указывает свой локальный PDF либо сохранённый JSON с его метаданными.
  dl: Источник ⊑ ∃хранитсяВ.Файл
  check:
    kind: some
    class: Источник
    property: хранитсяВ
    target: Файл
- id: П2
  text: Каждая модель основана хотя бы на одном источнике.
  dl: Модель ⊑ ∃основанаНа.Источник
  check:
    kind: some
    class: Модель
    property: основанаНа
    target: Источник
- id: П3
  text: У каждого утверждения есть первоисточник.
  dl: Утверждение ⊑ ∃сформулированоВ.Источник
  check:
    kind: some
    class: Утверждение
    property: сформулированоВ
    target: Источник
- id: П4
  text: Каждое утверждение относится к конкретной модели.
  dl: Утверждение ⊑ ∃относитсяК.Модель
  check:
    kind: some
    class: Утверждение
    property: относитсяК
    target: Модель
- id: П5
  text: У каждой модели записано хотя бы одно утверждение.
  dl: Модель ⊑ ∃относитсяК⁻.Утверждение
  check:
    kind: some_inverse
    class: Модель
    property: относитсяК
    source: Утверждение
- id: П6
  text: Каждое ограничение связано с моделью, к которой относится.
  dl: Ограничение ⊑ ∃ограничивает.Модель
  check:
    kind: some
    class: Ограничение
    property: ограничивает
    target: Модель
- id: П7
  text: Каждый отчёт ссылается на источник.
  dl: Отчёт ⊑ ∃ссылаетсяНа.Источник
  check:
    kind: some
    class: Отчёт
    property: ссылаетсяНа
    target: Источник
- id: П8
  text: Выполненная задача имеет статус выполнена или принята.
  dl: ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}
  check:
    kind: defined_value
    name: ВыполненнаяЗадача
    class: Задача
    attribute: status
    values:
    - выполнена
    - принята
- id: П9
  text: Выполненную задачу закрывает анализ, проверка, подготовка, отчёт или подзадачи.
  dl: ВыполненнаяЗадача ⊑ ∃решает⁻.⊤ ⊔ ∃выполняет⁻.⊤ ⊔ ∃подзадачаОт⁻.⊤
  check:
    kind: some_inverse_any
    class: ВыполненнаяЗадача
    properties:
    - решает
    - выполняет
    - подзадачаОт
- id: П10
  text: Все подзадачи выполненной задачи должны быть выполнены.
  dl: ВыполненнаяЗадача ⊑ ∀подзадачаОт⁻.ВыполненнаяЗадача
  check:
    kind: all_inverse
    class: ВыполненнаяЗадача
    property: подзадачаОт
    source: ВыполненнаяЗадача
- id: П11
  text: У выполненной задачи есть содержательный раздел Итог.
  dl: Правило оформления
  check:
    kind: section
    class: ВыполненнаяЗадача
    section: Итог
- id: Л1
  text: Каждый источник указывает запрос к внешнему графу, которым он найден или сверен.
  dl: Источник ⊑ ∃найденЗапросом.ЗапросКГрафу
  check:
    kind: some
    class: Источник
    property: найденЗапросом
    target: ЗапросКГрафу
- id: Л2
  text: У каждого источника записан хотя бы один автор.
  dl: Источник ⊑ ∃написан.Автор
  check:
    kind: some
    class: Источник
    property: написан
    target: Автор
